<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>Flash Loader</title>



<!-- Ruffle -->

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>



<style>

    html, body {

        margin: 0;

        padding: 0;

        height: 100%;

        background: #000;

        color: white;

        font-family: sans-serif;

    }

    #player-container {

        width: 100%;

        height: 100%;

    }

</style>

</head>

<body>



<div id="player-container"></div>



<script>

(function () {

    const url = window.location.href;

    const marker = "!LOADSWF!";



    // Check if the URL contains your marker

    if (url.includes(marker)) {

        // Extract the SWF URL after !LOADSWF!

        const swf = url.split(marker)[1];



        // Create Ruffle player

        const ruffle = window.RufflePlayer.newest();

        const player = ruffle.createPlayer();



        document.getElementById("player-container").appendChild(player);

        player.load(swf);



    } else {

        // Optional fallback message

        document.body.innerHTML = "<h2>No SWF specified.</h2>";

    }

})();

</script>



</body>

</html>
