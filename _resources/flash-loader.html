<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flash Loader</title>

<!-- Load your patcher -->
<script src="../js/rgPatcher.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: Arial, sans-serif;
    }
    #player-container {
        width: 100vw;
        height: 100vh;
    }
    #input-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 300px;
        text-align: center;
    }
    input {
        padding: 8px;
        border-radius: 5px;
        border: none;
    }
    button {
        padding: 8px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="player-container" style="display:none;"></div>

<div id="input-box" style="display:none;">
    <h2>Enter SWF URL</h2>
    <input type="text" id="swfInput" placeholder="https://example.com/file.swf">
    <button onclick="loadFromTextbox()">Load SWF</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let swf = params.get("LOADSWF");

if (!swf) {
    document.getElementById("input-box").style.display = "flex";
} else {
    startRuffle(swf);
}

function loadFromTextbox() {
    const url = document.getElementById("swfInput").value.trim();
    if (url) startRuffle(url);
}

function startRuffle(swfUrl) {
    document.getElementById("input-box").style.display = "none";
    document.getElementById("player-container").style.display = "block";

    function waitForRuffle() {
        if (window.RufflePlayer && window.RufflePlayer.newest) {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            player.style.width = "100%";
            player.style.height = "100%";

            document.getElementById("player-container").appendChild(player);

            player.load(swfUrl);
        } else {
            setTimeout(waitForRuffle, 50);
        }
    }

    waitForRuffle();
}
</script>

</body>
</html>
