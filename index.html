<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>

  <!-- Instant redirect -->
  <script>
    const newBase = "https://NAME.SERVER.dev/webarchive";
    const path = window.location.pathname.replace(/^\/webarchive/, "");
    window.location.replace(newBase + path);
  </script>

  <!-- Fallback if JS is disabled -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://NAME.SERVER.dev/webarchive">
  </noscript>
</head>
<body>
  Redirecting to the new archive…
</body>
</html>
