	<title>Rockstar Games presents Bully</title>
	<meta name="description" content="Rockstar Games Presents Bully, for PlayStation(R)2.">

<body bgcolor="#2466AD">
<script>
var playURL = window.location.href;
var queryString = playURL.split("?")[1];

var play = "none";

if(queryString){
	play = queryString.split("play=")[1];
	document.location.href="home/index.html?play="+play;
}else{
	document.location.href="home";
}
</script>

</body>
