	<script>
	var expireDate = new Date();
	var year = expireDate.getYear(); 
	year = (year < 1900) ? year + 1900 : year;
	expireDate.setYear(year + 3);

	function cookieCheck() {
	  var allcookies = document.cookie;
	  var detectCookie = allcookies.indexOf("contest_swingerscontest_check=");
	   var strQueryString = allcookies.substr(allcookies.indexOf("=")+1, 2).toLowerCase(); 	
		if (detectCookie != -1) {
			if(strQueryString <= 13){
				location.replace("http://www.rockstargames.com/esrb/");
			}else{
				location.replace("rules.html");
			}
		}
	}
		
	//creates a cookie with the values passed in
	function my_setCookie(nam, val, expire, domain, path) {
		var cookie_str = "";
		cookie_str += nam + "=" + escape(val);
		cookie_str += "; expires=" + expire.toGMTString();
		document.cookie = cookie_str;
	};

	function setCookie(age) {    
		my_setCookie("contest_swingerscontest_check", age , expireDate, ".rockstargames.com", "/");
	} 	

	function checkIt(){
		var agt=navigator.userAgent.toLowerCase();
		var appVer = navigator.appVersion.toLowerCase();
		var is_mac = (agt.indexOf("mac")!=-1);
		var iePos  = appVer.indexOf('msie');
		
		if(iePos !=-1 && is_mac){
			location.href="index_ie.html";
		}
	}
		//window.onload=checkIt;
	</script>

	<script>
	function validate(){
	result = true;
	for(x=0; x<8; x++) {
		if (document.frmReg.elements[x].value=='') result = false;
	}
	if (document.frmReg.elements[8].value=='--') result = false;
	
	if (!result) {alert('Please fill out all the fields and select a shirt size.');}
	else{
		//check email
		str = document.frmReg.elements[3].value;
		strLen=str.length;
		
		//check if @ and . exist
		if((str.indexOf(".") < 1) || (str.indexOf("@") < 2) || (str.indexOf(".")+1 >= strLen)){
			result = false;
			alert('Please enter a valid email address.');
		}
		//if @ and . exist check if anything else exists
		else{
			if(strLen<6){
				result = false;
				alert('Please enter a valid email address.');
			}
			else{
				//check age
				str='';
				str=isNaN(document.frmReg.elements[2].value);
				if(str){
					result = false;
					alert('Please enter a valid age.');
				}
				else{
					theAge=document.frmReg.elements[2].value;
					if(theAge < 18){
						document.frmReg.reset();
						result = false;
						setCookie(theAge);
						if(theAge >= 13){
							alert('Sorry, but your entry is not valid.  Please see the official rules for details.');
							document.location.href="rules.html";
						}
						else{	
							alert('Sorry, but your entry is not valid.  Please see our privacy policy for more information.');
							document.location.href="http://www.rockstargames.com/esrb/";
						}
					}
					else{
						result = true;
					}
								
				}
			}
		}
	}
	return result;
}
