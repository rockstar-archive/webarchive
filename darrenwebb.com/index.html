// Cookie life
DaysToLive = 2;

function GetCookie(name) {
	var cookiecontent = '0';
	if(document.cookie.length > 0) {
		var cookiename = name + '=';
		var cookiebegin = document.cookie.indexOf(cookiename);
		var cookieend = 0;
		if(cookiebegin > -1) {

	return value;

function PutCookie(n,v) {
	var exp = '';
	if(DaysToLive > 0) {
		var now = new Date();
		then = now.getTime() + (DaysToLive * 24 * 60 * 60 * 1000);
		now.setTime(then);
		exp = '; expires=' +
		now.toGMTString();
	}
	document.cookie = n + "=" + v + '; path=/' + exp;
}
